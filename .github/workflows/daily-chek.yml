name: Daily Case Reminder Check

on:
  schedule:
    - cron: '0 7 * * *'    # 8:00 AM Nigeria time
    - cron: '0 14 * * *'   # 3:00 PM Nigeria time
  workflow_dispatch:
jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run reminder check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-reminders.js
