name: Daily Case Reminder Check

on:
  schedule:
    - cron: '0 6 * * *'   # runs every day at 6:00 AM UTC (adjust if needed)
  workflow_dispatch:        # also lets you trigger it manually for testing

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run reminder check
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-reminders.js